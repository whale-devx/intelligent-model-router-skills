name: Bug report
description: Report an installation, documentation, or routing problem with a reproducible example.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the skill. English and Thai reports are welcome.
        Do not include API keys, private prompts, account details, or personal inventories.
        For vulnerabilities, follow [SECURITY.md](https://github.com/whale-devx/intelligent-model-router-skills/blob/main/SECURITY.md) instead of posting exploit details here.
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Installation or skill discovery
        - Instructions or documentation
        - Inventory import
        - Routing decision
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host and version, operating system, installer version, and Python version if relevant. Do not include account identifiers.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Skill commit or version
      description: A commit SHA is preferred. Write unknown if you cannot determine it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal, sanitized or synthetic example. State what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output or screenshots
      description: Include failures and relevant warnings. Remove credentials, private prompts, and inventory/account identifiers.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have checked this report for secrets and private user data.
          required: true
