name: Skill installation
on:
  push:
    paths: ['skills/**', 'tools/**', '.github/workflows/installation.yml', 'docs/INSTALLATION-TESTS.md']
  pull_request:
    paths: ['skills/**', 'tools/**', '.github/workflows/installation.yml', 'docs/INSTALLATION-TESTS.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package validation (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check -r tools/requirements-test.txt
      - run: python -m unittest discover -s tools/tests -v
      - run: python tools/validate_package.py skills/intelligent-model-router --expected-license LICENSE
  installer:
    name: npx (${{ matrix.os }}, ${{ matrix.source }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        source: [local, github]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_MODE: ${{ matrix.source }}
      REPORT_PATH: ${{ runner.temp }}/installation-${{ matrix.os }}-${{ matrix.source }}.json
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: python -m pip install --disable-pip-version-check -r tools/requirements-test.txt
      - name: Install, list, verify files, and run installed offline helpers
        shell: bash
        run: >-
          python tools/install_smoke.py --source "$SOURCE_MODE"
          --repository "$SOURCE_REPOSITORY" --ref "$SOURCE_REF" --output "$REPORT_PATH"
      - name: Preserve exact versions, manifests, commands, and case outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installation-${{ matrix.os }}-${{ matrix.source }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 14
